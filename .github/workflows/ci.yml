name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    # Flutter 3.41.7, la version du poste de développement.
    container: ghcr.io/cirruslabs/flutter:3.41.7
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test test_integration
      - run: flutter analyze
      - run: flutter test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase db start
      - run: supabase test db

  android:
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/flutter:3.41.7
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: flutter pub get
      # Build de publication sans secret (clé de debug, identifiants de démonstration) :
      # vérifie que l'app compile et passe la réduction de code (R8).
      - run: >-
          flutter build appbundle --release
          --dart-define-from-file=env/example.json
          -PADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713
