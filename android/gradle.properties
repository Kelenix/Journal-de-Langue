# Mémoire bornée : la machine virtuelle de Docker Desktop (8 Go) fait aussi tourner Supabase ;
# avec les 8 Go par défaut de Flutter, le build de publication (R8) faisait tomber Docker.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx768m
android.useAndroidX=true
